# ============================================================
# Limine Bootloader 配置文件
# 路径：/boot/limine.cfg（NixOS 自动管理，此文件为参考模板）
#
# 注意：NixOS 通过 boot.loader.limine.enable = true 自动生成
# /boot/limine.cfg，手动修改此文件不会生效。
# 此文件仅作为配置参考和文档记录。
# ============================================================

# 超时时间（秒），0 表示不等待直接启动默认项
TIMEOUT=5

# 默认启动项序号（从 0 开始）
DEFAULT_ENTRY=0

# 图形界面分辨率
# GRAPHICS=1920x1080

# 背景图片（放在 /boot/ 下）
# BACKGROUND_PATH=boot/background.bmp

# 字体
# FONT_SIZE=16

# ============================================================
# 启动项 0：NixOS（默认）
# ============================================================
:NixOS (default)
    PROTOCOL=linux
    KERNEL_PATH=boot/vmlinuz
    CMDLINE=init=/nix/store/xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx-systemd-255.4/lib/systemd/systemd loglevel=4
    MODULE_PATH=boot/initrd

# ============================================================
# 启动项 1：NixOS（旧一代配置，回滚用）
# ============================================================
:NixOS (previous generation)
    PROTOCOL=linux
    KERNEL_PATH=boot/vmlinuz.old
    CMDLINE=init=/nix/store/xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx-systemd-255.4/lib/systemd/systemd loglevel=4
    MODULE_PATH=boot/initrd.old

# ============================================================
# 启动项 2：NixOS（救援模式）
# ============================================================
:NixOS (rescue)
    PROTOCOL=linux
    KERNEL_PATH=boot/vmlinuz
    CMDLINE=init=/nix/store/xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx-systemd-255.4/lib/systemd/systemd rescue loglevel=4
    MODULE_PATH=boot/initrd

# ============================================================
# 启动项 3：UEFI Shell
# ============================================================
:UEFI Shell
    PROTOCOL=uefi_shell

# ============================================================
# 启动项 4：重启到固件设置（BIOS/UEFI）
# ============================================================
:Reboot to Firmware Setup
    PROTOCOL=firmware_setup
