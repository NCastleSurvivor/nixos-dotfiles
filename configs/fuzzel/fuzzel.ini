# ============================================================
# Fuzzel 应用启动器配置
# 路径：~/.config/fuzzel/fuzzel.ini
# ============================================================

[main]
# 终端模拟器（用于启动终端程序）
terminal=kitty

# 字体
font=JetBrainsMono Nerd Font:size=13
icon-theme=Papirus
icon-theme=Adwaita

# 窗口大小
width=60
height=40
horizontal-pad=20
vertical-pad=15
line-height=28
border-radius=8
border-width=1

# 行为
show-actions=true
show-desktop-action=true
dpi-aware=auto
layer=top
include-to-user-paths=true
password-character=*
index-max=5000

# 匹配模式（fuzzy = 模糊匹配）
filter-mode=fuzzy
fuzzy-min-length=2
fuzzy-max-distance=5

# 排序
sort=name
sort-case-sensitive=false
sort-localized=true

# 退出行为
exit-on-keyboard-focus-loss=true
exit-on-mouse-back=true

# 最近使用
enable-recent=true
recent-max=20

# ===== 颜色（Catppuccin Mocha）=====
[colors]
background=1e1e2e
text=cdd6f4
match=89b4fa
selection=313244
selection-text=cdd6f4
selection-match=89b4fa
border=45475a
cursor=89b4fa
cursor-text=1e1e2e

# ===== 键盘快捷键 =====
[key-bindings]
# 移动选择
move-up=Up,Control+p,Control+k
move-down=Down,Control+n,Control+j
move-first=Home,Control+g
move-last=End,Control+e

# 页面滚动
page-up=Page_Up,Control+v,Alt+v
page-down=Page_Down,Control+v

# 执行
execute=Return,Control+j,Control+m
execute-alt=Shift+Return,Control+Return
execute-terminal=Control+t

# 退出
abort=Escape,Control+c,Control+g

# 删除
erase=BackSpace
erase-char=Control+h
erase-word=Control+w
erase-line=Control+u

# 光标移动
cursor-left=Left,Control+b
cursor-right=Right,Control+f
cursor-word-left=Alt+b,Control+Left
cursor-word-right=Alt+f,Control+Right
cursor-beginning=Home,Control+a
cursor-end=End,Control+e

# 历史
previous-match=Up
next-match=Down
