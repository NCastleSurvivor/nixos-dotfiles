# 🌙 Kitty Terminal - 深蓝夜色主题
# ================================

# 字体配置 - 更大更清晰
font_family                 JetBrainsMono Nerd Font
font_size                   13
bold_font                   auto
italic_font                 auto
bold_italic_font            auto

# 字体特性增强
disable_ligatures           never
font_features               none

# 窗口配置
remember_window_size        no
initial_window_width        1000
initial_window_height       600
window_padding_width        15
window_padding_height       15
hide_window_decorations     yes

# 🎯 不透明度设置 - 完全不透明
background_opacity          1.0
dynamic_background_opacity  no

# 光标配置 - 更醒目的光标
cursor_shape                beam
cursor_beam_thickness       2.0
cursor_blink_interval       0.5
cursor_stop_blinking_after  15

# 滚动配置
scrollback_lines            10000
scrollback_pager_history_size 10
wheel_scroll_min_lines      1
wheel_scroll_multiplier     5.0
touch_scroll_multiplier     1.0

# 鼠标配置
mouse_hide_wait             3.0
url_color                   #7aa2f7
url_style                   curly
open_url_with               default
detect_urls                 yes
copy_on_select              no

# 性能优化
repaint_delay               10
input_delay                 3
sync_to_monitor             yes

# 音频
enable_audio_bell           no
visual_bell_duration        0.0

# 窗口管理
enabled_layouts             tall,stack,grid
window_resize_step_cells    2
window_resize_step_lines    2
window_border_width         1pt
draw_minimal_borders        yes
window_margin_width         0
single_window_margin_width  -1

# 标签栏美化
tab_bar_edge                bottom
tab_bar_margin_width        0.0
tab_bar_margin_height       0.0 0.0
tab_bar_style               powerline
tab_bar_align               left
tab_bar_min_tabs            2
tab_powerline_style         slanted
tab_title_template          "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{title}"
active_tab_title_template   none

# 选择配置
selection_foreground        #1a1b26
selection_background        #7aa2f7

# 高级选项
allow_remote_control        no
shell_integration           enabled
term                        xterm-256color
confirm_os_window_close     0

# 剪贴板
clipboard_control           write-clipboard write-primary read-clipboard-ask read-primary-ask
clipboard_max_size          512

# 性能
update_check_interval       0

# ================================
# 🎨 深蓝夜色配色方案
# ================================

# 主要背景和前景色
foreground                  #c0caf5
background                  #1a1b26
cursor                      #c0caf5
cursor_text_color           #1a1b26

# 选择颜色
selection_foreground        #1a1b26
selection_background        #7aa2f7

# 黑色
color0                      #15161e
color8                      #414868

# 红色
color1                      #f7768e
color9                      #f7768e

# 绿色
color2                      #9ece6a
color10                     #9ece6a

# 黄色
color3                      #e0af68
color11                     #e0af68

# 蓝色
color4                      #7aa2f7
color12                     #7aa2f7

# 品红/紫色
color5                      #bb9af7
color13                     #bb9af7

# 青色
color6                      #7dcfff
color14                     #7dcfff

# 白色
color7                      #a9b1d6
color15                     #c0caf5

# 扩展颜色（深蓝系）
color16                     #ff9e64
color17                     #db4b4b

# 标签栏配色
active_tab_foreground       #1a1b26
active_tab_background       #7aa2f7
active_tab_font_style       bold
inactive_tab_foreground     #787c99
inactive_tab_background     #1f2335
inactive_tab_font_style     normal

# 窗口边框配色
active_border_color         #7aa2f7
inactive_border_color       #414868
bell_border_color           #e0af68

# Animated cursor follows text
#include $HOME/.config/ml4w/settings/kitty-cursor-trail.conf

# 如果你想使用原来的颜色配置，可以取消下面这行的注释
# include colors-matugen.conf

# Include Custom Configuration
# Create the file custom.conf in ~/.config/kitty to overwrite the default configuration
include ./custom.conf
